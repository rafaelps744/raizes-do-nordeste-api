services:
  postgres:
    image: postgres:16-alpine
    container_name: raizes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: raizes
      POSTGRES_PASSWORD: raizes
      POSTGRES_DB: raizes_do_nordeste
    ports:
      - "5432:5432"
    volumes:
      - raizes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raizes -d raizes_do_nordeste"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  raizes_pgdata:
